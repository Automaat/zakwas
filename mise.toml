[tools]
go = "1.27.3"
golangci-lint = "2.15.0"
shellcheck = "0.11.0"
actionlint = "1.7.12"
"aqua:goreleaser/goreleaser" = "2.19.0"

[tasks.test]
run = "go test -race ./..."

[tasks."test:integration"]
run = "go test -race -tags integration ./..."

[tasks.lint]
run = "golangci-lint run"

[tasks.schema]
description = "Regenerate schema/zakwas.schema.json from internal/config"
run = "go generate ./schema"
