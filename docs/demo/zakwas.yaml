# yaml-language-server: $schema=https://raw.githubusercontent.com/Automaat/zakwas/main/schema/zakwas.schema.json
protect:
  immutable: true
files:
  - {src: dotfiles/zshrc, dst: ~/.zshrc}
  - {src: dotfiles/gitconfig, dst: ~/.config/git/config}
templates:
  vars:
    email: you@example.com
  files:
    - {src: dotfiles/gituser.tmpl, dst: ~/.config/git/user}
agents:
  providers: [claude, codex]
  instructions: agents/AGENTS.md
  mcp:
    docs: {command: npx, args: [-y, "@example/docs-mcp"], envVars: [DOCS_TOKEN]}
  skills:
    - agents/skills/review
  profiles:
    review:
      description: Read-only change review
      prompt: agents/review.md
      edit: deny
      shell: ask
commands:
  - name: projects dir
    check: test -d Projects
    run: mkdir Projects && echo "created ~/Projects"
