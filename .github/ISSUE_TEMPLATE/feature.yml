name: Feature request
description: A new module, option, or command
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you want to manage or do that zakwas can't today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed config or command
      description: How you'd like it to look in zakwas.yaml or on the command line.
      render: yaml
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds
      description: What you do now, e.g. a `commands` entry.
