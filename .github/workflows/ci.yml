name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.12

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
            ~/Library/Caches/golangci-lint
          key: go-test-${{ runner.os }}-${{ hashFiles('go.sum', 'mise.toml') }}
          restore-keys: go-test-${{ runner.os }}-

      - name: lint
        run: mise run lint

      - name: shellcheck
        run: shellcheck install.sh

      - name: actionlint
        run: actionlint

      - name: release config builds
        run: goreleaser release --snapshot --clean --skip=publish

      # `brew tap` validates every cask for every OS and arch; one invalid
      # cask makes the whole tap fail to load.
      - name: generated cask loads on every platform
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -o pipefail
          brew tap-new --no-git zakwas-ci/tap
          brew trust zakwas-ci/tap
          tap="$(brew --repository)/Library/Taps/zakwas-ci/homebrew-tap"
          mkdir -p "$tap/Casks"
          cp dist/homebrew/Casks/zakwas.rb "$tap/Casks/"
          # readall skips untrusted taps with exit 0; make that a failure.
          brew readall --os=all --arch=all zakwas-ci/tap 2>&1 | tee "$RUNNER_TEMP/readall.log"
          if grep -q Skipping "$RUNNER_TEMP/readall.log"; then exit 1; fi

      - name: unit, e2e and integration tests
        run: mise run test:integration

      - name: example config resolves on a real Mac
        run: go run ./cmd/zakwas -c examples/zakwas.yaml plan --only system,files,links,templates,agents,commands,defaults

      # The brew module parses undocumented `brew bundle` output. The runner
      # ships formulae the example Brewfile doesn't list, so a working cleanup
      # parser must report some; an empty list means the format changed.
      - name: brew output parsers work against real Homebrew
        run: |
          go run ./cmd/zakwas -c examples/zakwas.yaml plan --only brew | tee "$RUNNER_TEMP/brew.plan"
          grep -qE '^  - (brew|cask) ' "$RUNNER_TEMP/brew.plan"

  e2e:
    name: e2e on a fresh Mac
    # Converges a clean macOS runner with the example config. Casks and
    # brew zap are skipped: they'd uninstall the runner's own tooling.
    runs-on: macos-26
    timeout-minutes: 30
    env:
      MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.12

      - name: build
        run: go build -o "$RUNNER_TEMP/zakwas" ./cmd/zakwas

      - name: apply
        run: |
          "$RUNNER_TEMP/zakwas" -c examples/zakwas.yaml apply -y --only system,files,templates,defaults

      - name: nothing left to change
        run: |
          "$RUNNER_TEMP/zakwas" -c examples/zakwas.yaml check --only system,files,templates,defaults

      - name: dotfiles are protected
        run: |
          if echo x >> "$HOME/.zshrc"; then echo "$HOME/.zshrc is writable"; exit 1; fi
          stat -f %Sf "$HOME/.zshrc" | grep -q uchg

  install:
    name: install.sh on a fresh Mac
    # Installs the latest published release, so it gates the installer, not
    # this commit's code.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install.sh
        run: ./install.sh --dir "$GITHUB_WORKSPACE/examples" --no-apply < /dev/null

      - name: installed zakwas plans the example config
        working-directory: examples
        run: |
          ~/.local/bin/zakwas version
          ~/.local/bin/zakwas plan --only system,files,templates,defaults

  bootstrap:
    name: installs mise on a Mac without it
    # The runner image has Homebrew but no mise, so the mise module must
    # download it and then install the example's tools with it.
    runs-on: macos-26
    timeout-minutes: 20
    env:
      MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: build
        run: go build -o "$RUNNER_TEMP/zakwas" ./cmd/zakwas

      - name: no mise yet
        run: if command -v mise; then echo "runner already has mise"; exit 1; fi

      - name: apply
        run: |
          "$RUNNER_TEMP/zakwas" -c examples/zakwas.yaml apply -y --only files,mise

      - name: mise and the pinned tools are installed
        run: |
          ~/.local/bin/mise --version
          "$RUNNER_TEMP/zakwas" -c examples/zakwas.yaml check --only files,mise

  windows:
    name: windows
    # Windows support is early: the agent features and the portable core are
    # built and tested here. The macOS-only modules and tests that need sh,
    # POSIX file modes or symlinks are skipped with a reason.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: build
        run: go build ./...

      - name: build for arm64
        env:
          GOARCH: arm64
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: vet for arm64
        env:
          GOARCH: arm64
        run: go vet ./...

      - name: test
        run: go test ./...

      - name: install.ps1 passes PSScriptAnalyzer
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Write-Warning 'PSScriptAnalyzer is not on this runner; only the syntax was checked'
            exit 0
          }
          $findings = Invoke-ScriptAnalyzer -Path install.ps1 -Severity Warning, Error
          $findings | Format-Table
          if ($findings) { exit 1 }

      # A local server stands in for GitHub, so the test makes no outside call.
      - name: install.ps1 installs a release and rejects a bad checksum
        shell: pwsh
        run: |
          $version = '9.9.9'
          $arch = if ([Runtime.InteropServices.RuntimeInformation]::OSArchitecture -eq 'Arm64') { 'arm64' } else { 'amd64' }
          $asset = "zakwas_${version}_windows_$arch.zip"
          $site = Join-Path $env:RUNNER_TEMP 'site'
          $release = Join-Path $site "download/v$version"
          New-Item -ItemType Directory -Force -Path $release | Out-Null
          $exe = Join-Path $env:RUNNER_TEMP 'zakwas.exe'
          go build -ldflags "-X main.version=$version" -o $exe ./cmd/zakwas
          Compress-Archive -Path $exe -DestinationPath (Join-Path $release $asset)
          $hash = (Get-FileHash -Algorithm SHA256 -Path (Join-Path $release $asset)).Hash.ToLowerInvariant()
          $sums = Join-Path $release 'checksums.txt'
          "$hash  $asset" | Set-Content -Encoding ascii -Path $sums
          $server = Start-Process -PassThru -WindowStyle Hidden -FilePath python -ArgumentList '-m', 'http.server', '8765', '--bind', '127.0.0.1', '--directory', $site
          try {
            Start-Sleep -Seconds 3
            foreach ($shell in 'pwsh', 'powershell') {
              $dir = Join-Path $env:RUNNER_TEMP "bin-$shell"
              & $shell -NoProfile -File ./install.ps1 -Version $version -BaseUrl http://127.0.0.1:8765 -Dir $dir
              if ($LASTEXITCODE -ne 0) { throw "$shell install failed" }
              $got = & (Join-Path $dir 'zakwas.exe') version
              if ($got -ne "zakwas $version") { throw "$shell installed '$got'" }
            }
            ('0' * 64) + "  $asset" | Set-Content -Encoding ascii -Path $sums
            $dir = Join-Path $env:RUNNER_TEMP 'bin-bad'
            & pwsh -NoProfile -File ./install.ps1 -Version $version -BaseUrl http://127.0.0.1:8765 -Dir $dir
            if ($LASTEXITCODE -eq 0) { throw 'install.ps1 accepted a bad checksum' }
            if (Test-Path (Join-Path $dir 'zakwas.exe')) { throw 'a bad download was installed' }
          } finally {
            Stop-Process -Id $server.Id -ErrorAction SilentlyContinue
          }
          exit 0
