name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.3

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
            ~/Library/Caches/golangci-lint
          key: go-test-${{ runner.os }}-${{ hashFiles('go.sum', 'mise.toml') }}
          restore-keys: go-test-${{ runner.os }}-

      - name: lint
        run: mise run lint

      - name: shellcheck
        run: shellcheck install.sh

      - name: actionlint
        run: actionlint

      - name: release config builds
        run: goreleaser release --snapshot --clean --skip=publish

      # `brew tap` validates every cask for every OS and arch; one invalid
      # cask makes the whole tap fail to load.
      - name: generated cask loads on every platform
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -o pipefail
          brew tap-new --no-git zakwas-ci/tap
          brew trust zakwas-ci/tap
          tap="$(brew --repository)/Library/Taps/zakwas-ci/homebrew-tap"
          mkdir -p "$tap/Casks"
          cp dist/homebrew/Casks/zakwas.rb "$tap/Casks/"
          # readall skips untrusted taps with exit 0; make that a failure.
          brew readall --os=all --arch=all zakwas-ci/tap 2>&1 | tee "$RUNNER_TEMP/readall.log"
          if grep -q Skipping "$RUNNER_TEMP/readall.log"; then exit 1; fi

      - name: unit, e2e and integration tests
        run: mise run test:integration

      - name: example config resolves on a real Mac
        run: go run ./cmd/zakwas -c examples/zakwas.yaml plan --only system,files,links,templates,commands,defaults

      # The brew module parses undocumented `brew bundle` output. The runner
      # ships formulae the example Brewfile doesn't list, so a working cleanup
      # parser must report some; an empty list means the format changed.
      - name: brew output parsers work against real Homebrew
        run: |
          go run ./cmd/zakwas -c examples/zakwas.yaml plan --only brew | tee "$RUNNER_TEMP/brew.plan"
          grep -qE '^  - (brew|cask) ' "$RUNNER_TEMP/brew.plan"

  e2e:
    name: e2e on a fresh Mac
    # Converges a clean macOS runner with the example config. Casks and
    # brew zap are skipped: they'd uninstall the runner's own tooling.
    runs-on: macos-26
    timeout-minutes: 30
    env:
      MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.3

      - name: build
        run: go build -o "$RUNNER_TEMP/zakwas" ./cmd/zakwas

      - name: apply
        run: |
          "$RUNNER_TEMP/zakwas" -c examples/zakwas.yaml apply -y --only system,files,templates,defaults

      - name: nothing left to change
        run: |
          "$RUNNER_TEMP/zakwas" -c examples/zakwas.yaml check --only system,files,templates,defaults

      - name: dotfiles are protected
        run: |
          if echo x >> "$HOME/.zshrc"; then echo "$HOME/.zshrc is writable"; exit 1; fi
          stat -f %Sf "$HOME/.zshrc" | grep -q uchg

  install:
    name: install.sh on a fresh Mac
    # Installs the latest published release, so it gates the installer, not
    # this commit's code.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install.sh
        run: ./install.sh --dir "$GITHUB_WORKSPACE/examples" --no-apply < /dev/null

      - name: installed zakwas plans the example config
        working-directory: examples
        run: |
          ~/.local/bin/zakwas version
          ~/.local/bin/zakwas plan --only system,files,templates,defaults

  bootstrap:
    name: installs mise on a Mac without it
    # The runner image has Homebrew but no mise, so the mise module must
    # download it and then install the example's tools with it.
    runs-on: macos-26
    timeout-minutes: 20
    env:
      MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: build
        run: go build -o "$RUNNER_TEMP/zakwas" ./cmd/zakwas

      - name: no mise yet
        run: if command -v mise; then echo "runner already has mise"; exit 1; fi

      - name: apply
        run: |
          "$RUNNER_TEMP/zakwas" -c examples/zakwas.yaml apply -y --only files,mise

      - name: mise and the pinned tools are installed
        run: |
          ~/.local/bin/mise --version
          "$RUNNER_TEMP/zakwas" -c examples/zakwas.yaml check --only files,mise
