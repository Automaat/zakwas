name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.13

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
            ~/Library/Caches/golangci-lint
          key: go-test-${{ runner.os }}-${{ hashFiles('go.sum', 'mise.toml') }}
          restore-keys: go-test-${{ runner.os }}-

      - name: lint
        run: mise run lint

      - name: shellcheck
        run: shellcheck install.sh

      - name: actionlint
        run: actionlint

      - name: release config builds
        run: goreleaser release --snapshot --clean --skip=publish

      # `brew tap` validates every cask for every OS and arch; one invalid
      # cask makes the whole tap fail to load.
      - name: generated cask loads on every platform
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -o pipefail
          brew tap-new --no-git zakwas-ci/tap
          brew trust zakwas-ci/tap
          tap="$(brew --repository)/Library/Taps/zakwas-ci/homebrew-tap"
          mkdir -p "$tap/Casks"
          cp dist/homebrew/Casks/zakwas.rb "$tap/Casks/"
          # readall skips untrusted taps with exit 0; make that a failure.
          brew readall --os=all --arch=all zakwas-ci/tap 2>&1 | tee "$RUNNER_TEMP/readall.log"
          if grep -q Skipping "$RUNNER_TEMP/readall.log"; then exit 1; fi

      - name: unit, e2e and integration tests
        run: mise run test:integration

      - name: example config resolves on a real Mac
        run: go run ./cmd/zakwas -c examples/zakwas.yaml plan --only system,files,links,templates,agents,commands,defaults

      # The brew module parses undocumented `brew bundle` output. The runner
      # ships formulae the example Brewfile doesn't list, so a working cleanup
      # parser must report some; an empty list means the format changed.
      - name: brew output parsers work against real Homebrew
        run: |
          go run ./cmd/zakwas -c examples/zakwas.yaml plan --only brew | tee "$RUNNER_TEMP/brew.plan"
          grep -qE '^  - (brew|cask) ' "$RUNNER_TEMP/brew.plan"

  ubuntu:
    name: ubuntu
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.13

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-test-${{ runner.os }}-${{ hashFiles('go.sum', 'mise.toml') }}
          restore-keys: go-test-${{ runner.os }}-

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: still builds and vets for macOS
        env:
          GOOS: darwin
        run: |
          go build ./...
          go vet ./...

      - name: lint
        run: mise run lint

      - name: shellcheck
        run: shellcheck install.sh

      - name: actionlint
        run: actionlint

      - name: unit and e2e tests
        run: go test -race ./...

      - name: macOS-only modules are rejected
        run: |
          if go run ./cmd/zakwas -c examples/zakwas.yaml plan 2> "$RUNNER_TEMP/reject.log"; then
            echo "the macOS example planned on Linux"
            exit 1
          fi
          cat "$RUNNER_TEMP/reject.log"
          grep -q 'brew: not supported on Linux' "$RUNNER_TEMP/reject.log"
          grep -q 'docs/config.md#platform-support' "$RUNNER_TEMP/reject.log"

      - name: Linux example resolves
        run: go run ./cmd/zakwas -c examples/linux/zakwas.yaml plan

      - name: build the binary
        run: go build -o "$RUNNER_TEMP/zakwas" ./cmd/zakwas

      - name: apply the Linux example
        run: |
          "$RUNNER_TEMP/zakwas" -c examples/linux/zakwas.yaml apply -y

      - name: nothing left to change
        run: |
          "$RUNNER_TEMP/zakwas" -c examples/linux/zakwas.yaml check
          "$RUNNER_TEMP/zakwas" -c examples/linux/zakwas.yaml check --offline

      - name: dotfiles are read-only copies
        run: |
          if echo x >> "$HOME/.zshrc"; then echo "$HOME/.zshrc is writable"; exit 1; fi
          test "$(stat -c %a "$HOME/.zshrc")" = 444
          test "$(stat -c %a "$HOME/.ssh")" = 700

      - name: install.sh from a local release mirror
        # No release has Linux archives yet, so the installer downloads from
        # a mirror of this commit's build, served on localhost.
        run: |
          mirror="$RUNNER_TEMP/mirror"
          release="$mirror/releases/download/v0.0.0-ci"
          archive="zakwas_0.0.0-ci_linux_$(go env GOARCH).tar.gz"
          mkdir -p "$release" "$RUNNER_TEMP/pkg"
          go build -o "$RUNNER_TEMP/pkg/zakwas" ./cmd/zakwas
          tar -czf "$release/$archive" -C "$RUNNER_TEMP/pkg" zakwas
          (cd "$release" && sha256sum "$archive" > checksums.txt)
          python3 -m http.server 8123 --bind 127.0.0.1 --directory "$mirror" > "$RUNNER_TEMP/mirror.log" 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for _ in $(seq 20); do
            curl -fsS -o /dev/null "http://127.0.0.1:8123/releases/download/v0.0.0-ci/checksums.txt" && break
            sleep 0.5
          done
          export ZAKWAS_RELEASE_URL=http://127.0.0.1:8123/releases
          ./install.sh --version 0.0.0-ci --dir "$GITHUB_WORKSPACE/examples/linux" --no-apply < /dev/null
          ~/.local/bin/zakwas version
          (cd examples/linux && ~/.local/bin/zakwas plan --only system,files,templates)
          printf '%064d  %s\n' 0 "$archive" > "$release/checksums.txt"
          if ./install.sh --version 0.0.0-ci --dir "$GITHUB_WORKSPACE/examples/linux" --no-apply < /dev/null 2> "$RUNNER_TEMP/tamper.log"; then
            echo "install.sh accepted a bad checksum"
            exit 1
          fi
          grep -q 'checksum mismatch' "$RUNNER_TEMP/tamper.log"
          if ZAKWAS_RELEASE_URL='http://localhost:x@evil.example.com/releases' ./install.sh --version 0.0.0-ci --no-apply < /dev/null 2> "$RUNNER_TEMP/creds.log"; then
            echo "install.sh accepted a release URL with credentials"
            exit 1
          fi
          grep -q 'must not contain credentials' "$RUNNER_TEMP/creds.log"

  e2e:
    name: e2e on a fresh Mac
    # Converges a clean macOS runner with the example config. Casks and
    # brew zap are skipped: they'd uninstall the runner's own tooling.
    runs-on: macos-26
    timeout-minutes: 30
    env:
      MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.13

      - name: build
        run: go build -o "$RUNNER_TEMP/zakwas" ./cmd/zakwas

      - name: apply
        run: |
          "$RUNNER_TEMP/zakwas" -c examples/zakwas.yaml apply -y --only system,files,templates,defaults

      - name: nothing left to change
        run: |
          "$RUNNER_TEMP/zakwas" -c examples/zakwas.yaml check --only system,files,templates,defaults

      - name: dotfiles are protected
        run: |
          if echo x >> "$HOME/.zshrc"; then echo "$HOME/.zshrc is writable"; exit 1; fi
          stat -f %Sf "$HOME/.zshrc" | grep -q uchg

  install:
    name: install.sh on a fresh Mac
    # Installs the latest published release, so it gates the installer, not
    # this commit's code.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install.sh
        run: ./install.sh --dir "$GITHUB_WORKSPACE/examples" --no-apply < /dev/null

      - name: installed zakwas plans the example config
        working-directory: examples
        run: |
          ~/.local/bin/zakwas version
          ~/.local/bin/zakwas plan --only system,files,templates,defaults

  bootstrap:
    name: installs mise on a Mac without it
    # The runner image has Homebrew but no mise, so the mise module must
    # download it and then install the example's tools with it.
    runs-on: macos-26
    timeout-minutes: 20
    env:
      MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: build
        run: go build -o "$RUNNER_TEMP/zakwas" ./cmd/zakwas

      - name: no mise yet
        run: if command -v mise; then echo "runner already has mise"; exit 1; fi

      - name: apply
        run: |
          "$RUNNER_TEMP/zakwas" -c examples/zakwas.yaml apply -y --only files,mise

      - name: mise and the pinned tools are installed
        run: |
          ~/.local/bin/mise --version
          "$RUNNER_TEMP/zakwas" -c examples/zakwas.yaml check --only files,mise

  windows:
    name: windows
    # Windows support is early: the agent features and the portable core are
    # built and tested here. The macOS-only modules and tests that need sh,
    # POSIX file modes or symlinks are skipped with a reason.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: build
        run: go build ./...

      - name: build for arm64
        env:
          GOARCH: arm64
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: vet for arm64
        env:
          GOARCH: arm64
        run: go vet ./...

      - name: test
        run: go test ./...

      - name: install.ps1 passes PSScriptAnalyzer
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Write-Warning 'PSScriptAnalyzer is not on this runner; only the syntax was checked'
            exit 0
          }
          $findings = Invoke-ScriptAnalyzer -Path install.ps1 -Severity Warning, Error
          $findings | Format-Table
          if ($findings) { exit 1 }

      # A local server stands in for GitHub, so the test makes no outside call.
      - name: install.ps1 installs a release and rejects a bad checksum
        shell: pwsh
        run: |
          $version = '9.9.9'
          $arch = if ([Runtime.InteropServices.RuntimeInformation]::OSArchitecture -eq 'Arm64') { 'arm64' } else { 'amd64' }
          $asset = "zakwas_${version}_windows_$arch.zip"
          $site = Join-Path $env:RUNNER_TEMP 'site'
          $release = Join-Path $site "download/v$version"
          New-Item -ItemType Directory -Force -Path $release | Out-Null
          $exe = Join-Path $env:RUNNER_TEMP 'zakwas.exe'
          go build -ldflags "-X main.version=$version" -o $exe ./cmd/zakwas
          Compress-Archive -Path $exe -DestinationPath (Join-Path $release $asset)
          $hash = (Get-FileHash -Algorithm SHA256 -Path (Join-Path $release $asset)).Hash.ToLowerInvariant()
          $sums = Join-Path $release 'checksums.txt'
          "$hash  $asset" | Set-Content -Encoding ascii -Path $sums
          $server = Start-Process -PassThru -WindowStyle Hidden -FilePath python -ArgumentList '-m', 'http.server', '8765', '--bind', '127.0.0.1', '--directory', $site
          try {
            Start-Sleep -Seconds 3
            foreach ($shell in 'pwsh', 'powershell') {
              $dir = Join-Path $env:RUNNER_TEMP "bin-$shell"
              & $shell -NoProfile -File ./install.ps1 -Version $version -BaseUrl http://127.0.0.1:8765 -Dir $dir
              if ($LASTEXITCODE -ne 0) { throw "$shell install failed" }
              $got = & (Join-Path $dir 'zakwas.exe') version
              if ($got -ne "zakwas $version") { throw "$shell installed '$got'" }
            }
            ('0' * 64) + "  $asset" | Set-Content -Encoding ascii -Path $sums
            $dir = Join-Path $env:RUNNER_TEMP 'bin-bad'
            & pwsh -NoProfile -File ./install.ps1 -Version $version -BaseUrl http://127.0.0.1:8765 -Dir $dir
            if ($LASTEXITCODE -eq 0) { throw 'install.ps1 accepted a bad checksum' }
            if (Test-Path (Join-Path $dir 'zakwas.exe')) { throw 'a bad download was installed' }
            ((Get-FileHash -Algorithm SHA256 -Path (Join-Path $release $asset)).Hash.ToLowerInvariant() + "  $asset") | Set-Content -Encoding ascii -Path $sums
            foreach ($bad in 'ftp://127.0.0.1:8765', 'file:///C:/x', 'http://example.com', 'http://user:pw@127.0.0.1:8765', 'not a url') {
              $dir = Join-Path $env:RUNNER_TEMP 'bin-badurl'
              $out = & pwsh -NoProfile -File ./install.ps1 -Version $version -BaseUrl $bad -Dir $dir 2>&1 | Out-String
              if ($LASTEXITCODE -eq 0) { throw "install.ps1 accepted -BaseUrl $bad" }
              if ($out -notmatch 'BaseUrl') { throw "no clear error for -BaseUrl ${bad}: $out" }
              if (Test-Path $dir) { throw "a rejected -BaseUrl $bad created the install directory" }
            }
            $dir = Join-Path $env:RUNNER_TEMP 'bin-path'
            & pwsh -NoProfile -File ./install.ps1 -Version $version -BaseUrl http://127.0.0.1:8765 -Dir $dir -AddToPath
            if ($LASTEXITCODE -ne 0) { throw 'install -AddToPath failed' }
            $upper = $dir.ToUpperInvariant()
            & pwsh -NoProfile -File ./install.ps1 -Version $version -BaseUrl http://127.0.0.1:8765 -Dir $upper -AddToPath
            if ($LASTEXITCODE -ne 0) { throw 'a second install -AddToPath failed' }
            $key = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment')
            $raw = [string]$key.GetValue('Path', '', [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
            $key.Close()
            $mine = @($raw -split ';' | Where-Object { $_.Trim().TrimEnd('\') -ieq $dir })
            if ($mine.Count -ne 1) { throw "PATH holds the install directory $($mine.Count) times: $raw" }
            if ($raw -match ';;' -or $raw.StartsWith(';') -or $raw.EndsWith(';')) { throw "PATH has empty entries: $raw" }
            $dir = Join-Path $env:RUNNER_TEMP 'bin-running'
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            Copy-Item -Path (Join-Path $env:SystemRoot 'System32\ping.exe') -Destination (Join-Path $dir 'zakwas.exe')
            $busy = Start-Process -PassThru -WindowStyle Hidden -FilePath (Join-Path $dir 'zakwas.exe') -ArgumentList '-n', '60', '127.0.0.1'
            try {
              $out = & pwsh -NoProfile -File ./install.ps1 -Version $version -BaseUrl http://127.0.0.1:8765 -Dir $dir 2>&1 | Out-String
              if ($LASTEXITCODE -eq 0) { throw 'install.ps1 replaced a running zakwas.exe' }
              if ($out -notmatch 'is zakwas running') { throw "no clear error for a running zakwas.exe: $out" }
              if (Get-ChildItem -Path $dir -Filter 'zakwas.exe.new-*') { throw 'a staged copy was left behind' }
            } finally {
              Stop-Process -Id $busy.Id -ErrorAction SilentlyContinue
            }
          } finally {
            Stop-Process -Id $server.Id -ErrorAction SilentlyContinue
          }
          exit 0

      # The runner's own gh is hidden from PATH so each case controls what
      # install.ps1 finds. A tiny Go program stands in for gh.
      - name: install.ps1 checks build attestations like install.sh
        shell: pwsh
        run: |
          $arch = if ([Runtime.InteropServices.RuntimeInformation]::OSArchitecture -eq 'Arm64') { 'arm64' } else { 'amd64' }
          $site = Join-Path $env:RUNNER_TEMP 'site-attest'
          $exe = Join-Path $env:RUNNER_TEMP 'zakwas-attest.exe'
          go build -o $exe ./cmd/zakwas
          Copy-Item $exe (Join-Path $env:RUNNER_TEMP 'zakwas.exe') -Force
          foreach ($version in '9.9.9', '0.3.9') {
            $release = Join-Path $site "download/v$version"
            New-Item -ItemType Directory -Force -Path $release | Out-Null
            $asset = "zakwas_${version}_windows_$arch.zip"
            Compress-Archive -Path (Join-Path $env:RUNNER_TEMP 'zakwas.exe') -DestinationPath (Join-Path $release $asset)
            $hash = (Get-FileHash -Algorithm SHA256 -Path (Join-Path $release $asset)).Hash.ToLowerInvariant()
            "$hash  $asset" | Set-Content -Encoding ascii -Path (Join-Path $release 'checksums.txt')
          }

          $src = Join-Path $env:RUNNER_TEMP 'fakegh-src'
          New-Item -ItemType Directory -Force -Path $src | Out-Null
          @'
          package main

          import (
          	"fmt"
          	"os"
          	"strings"
          )

          func main() {
          	a := os.Args[1:]
          	mode := os.Getenv("FAKE_GH_MODE")
          	switch {
          	case len(a) >= 2 && a[0] == "auth" && a[1] == "status":
          		if mode == "loggedout" {
          			fmt.Fprintln(os.Stderr, "You are not logged into any GitHub hosts.")
          			os.Exit(1)
          		}
          		fmt.Fprintln(os.Stderr, "github.com: Logged in")
          	case len(a) >= 3 && a[0] == "attestation" && a[1] == "verify" && a[2] == "--help":
          		fmt.Println("Flags:\n  --repo string")
          		if mode != "old" {
          			fmt.Println("  --source-ref string")
          		}
          	case len(a) >= 3 && a[0] == "attestation" && a[1] == "verify":
          		if _, err := os.Stat(a[2]); err != nil {
          			fmt.Fprintln(os.Stderr, err)
          			os.Exit(2)
          		}
          		if log := os.Getenv("FAKE_GH_LOG"); log != "" {
          			f, _ := os.OpenFile(log, os.O_APPEND|os.O_CREATE|os.O_WRONLY, 0o644)
          			fmt.Fprintln(f, strings.Join(a[3:], " "))
          			f.Close()
          		}
          		if mode == "fail" {
          			fmt.Fprintln(os.Stderr, "no attestations found")
          			os.Exit(1)
          		}
          		fmt.Fprintln(os.Stderr, "Loaded digest")
          		fmt.Println("Verification succeeded")
          	default:
          		os.Exit(2)
          	}
          }
          '@ | Set-Content -Encoding ascii -Path (Join-Path $src 'main.go')
          $fakebin = Join-Path $env:RUNNER_TEMP 'fakegh-bin'
          Push-Location $src
          try { go build -o (Join-Path $fakebin 'gh.exe') main.go } finally { Pop-Location }

          $realPath = $env:Path
          $noGh = ($env:Path -split ';' | Where-Object { $_ -and -not (Test-Path (Join-Path $_ 'gh.exe')) }) -join ';'
          $log = Join-Path $env:RUNNER_TEMP 'fakegh.log'
          $server = Start-Process -PassThru -WindowStyle Hidden -FilePath python -ArgumentList '-m', 'http.server', '8766', '--bind', '127.0.0.1', '--directory', $site
          try {
            Start-Sleep -Seconds 3
            foreach ($shell in 'pwsh', 'powershell') {
              $n = 0
              foreach ($case in @(
                @{ gh = 'none';   version = '9.9.9'; ok = $true;  say = 'Skipped attestation check \(needs a recent gh, logged in\); to verify: gh release download v9\.9\.9 -R Automaat/zakwas -p zakwas_9\.9\.9_windows_\w+\.zip; gh attestation verify zakwas_9\.9\.9_windows_\w+\.zip --repo Automaat/zakwas --signer-workflow Automaat/zakwas/\.github/workflows/release\.yml --source-ref refs/tags/v9\.9\.9'; calls = 0 },
                @{ gh = 'ok';     version = '9.9.9'; ok = $true;  say = 'Verifying build provenance of zakwas_9\.9\.9_windows_\w+\.zip'; calls = 1 },
                @{ gh = 'fail';   version = '9.9.9'; ok = $false; say = 'attestation verification failed for zakwas_9\.9\.9_windows_\w+\.zip'; calls = 1 },
                @{ gh = 'loggedout'; version = '9.9.9'; ok = $true; say = 'Skipped attestation check'; calls = 0 },
                @{ gh = 'old';    version = '9.9.9'; ok = $true;  say = 'Skipped attestation check'; calls = 0 },
                @{ gh = 'ok';     version = '0.3.9'; ok = $true;  say = 'zakwas 0\.3\.9 predates build attestations; skipping provenance check'; calls = 0 }
              )) {
                $n++
                $dir = Join-Path $env:RUNNER_TEMP "bin-attest-$shell-$n"
                Remove-Item -Force -ErrorAction SilentlyContinue -Path $log
                $env:FAKE_GH_MODE = $case.gh
                $env:FAKE_GH_LOG = $log
                $env:Path = if ($case.gh -eq 'none') { $noGh } else { "$fakebin;$noGh" }
                try {
                  $out = & $shell -NoProfile -File ./install.ps1 -Version $case.version -BaseUrl http://127.0.0.1:8766 -Dir $dir 2>&1 | Out-String
                  $code = $LASTEXITCODE
                } finally {
                  $env:Path = $realPath
                }
                $label = "$shell gh=$($case.gh) v$($case.version)"
                if ($case.ok -and $code -ne 0) { throw "${label}: install failed: $out" }
                if (-not $case.ok -and $code -eq 0) { throw "${label}: install went on after a failed verification: $out" }
                if ($out -notmatch $case.say) { throw "${label}: output lacks '$($case.say)': $out" }
                if ((Test-Path (Join-Path $dir 'zakwas.exe')) -ne $case.ok) { throw "${label}: zakwas.exe installed = $(-not $case.ok)" }
                $calls = @(if (Test-Path $log) { Get-Content $log })
                if ($calls.Count -ne $case.calls) { throw "${label}: $($calls.Count) verify calls, want $($case.calls)" }
                if ($case.calls -eq 1 -and $calls[0] -ne '--repo Automaat/zakwas --signer-workflow Automaat/zakwas/.github/workflows/release.yml --source-ref refs/tags/v9.9.9') {
                  throw "${label}: verify options were '$($calls[0])'"
                }
              }
            }
          } finally {
            Remove-Item Env:FAKE_GH_MODE, Env:FAKE_GH_LOG -ErrorAction SilentlyContinue
            Stop-Process -Id $server.Id -ErrorAction SilentlyContinue
          }
          exit 0
