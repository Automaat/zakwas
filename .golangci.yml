version: "2"

run:
  build-tags:
    - integration

linters:
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - perfsprint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    revive:
      rules:
        - name: exported
          disabled: true

formatters:
  enable:
    - gofumpt
    - goimports
