# yaml-language-server: $schema=https://raw.githubusercontent.com/Automaat/zakwas/main/schema/zakwas.schema.json
protect:
  immutable: true

files:
  - {src: dotfiles/zsh/zshrc, dst: ~/.zshrc}
  - {src: dotfiles/git/config, dst: ~/.config/git/config}
  - {src: dotfiles/mise/config.toml, dst: ~/.config/mise/config.toml}

templates:
  vars:
    name: Your Name
  files:
    - {src: dotfiles/git/user.tmpl, dst: ~/.config/git/user}

brew:
  file: Brewfile
  cleanup: zap

mise:
  config: dotfiles/mise/config.toml
  prune: true

# Agents: one declaration, rendered in each agent's own format. This section
# needs no agent CLI, so `zakwas plan --only agents` works on a Mac without
# them; CI plans the other modules. Plugins and marketplaces call the agent
# CLIs, so they are not part of this example.
agents:
  providers: [claude, codex]  # gemini and copilot are opt-in too
  instructions: [dotfiles/agents/AGENTS.md]  # one rendered copy per agent
  mcp:
    docs: {command: npx, args: [-y, "@example/docs-mcp"], envVars: [DOCS_TOKEN]}
    search: {url: "https://mcp.example.com/mcp", bearerTokenEnv: SEARCH_TOKEN}
  skills:  # linked into every agent's skills directory
    - dotfiles/agents/skills/review
  profiles:  # claude --agent review, codex --profile review
    review:
      description: Read-only change review
      prompt: dotfiles/agents/review.md
      edit: deny
      shell: ask
      # mcp: unnamed servers are denied, so review gets neither docs nor search
  # permissions: {allow: [git status, git diff], deny: [git push --force]}
  # hooks: {commands: [{event: beforeTool, command: /path/to/check-tool}]}

system:
  sudoTouchID: true
  dirs:
    - {path: ~/.ssh, mode: 0o700}
  sshKey:
    path: ~/.ssh/id_ed25519
    comment: you@example.com

commands:
  - name: rosetta
    check: /usr/bin/pgrep -q oahd
    run: softwareupdate --install-rosetta --agree-to-license

# launchd:
#   - label: com.example.drift-check
#     program: [~/.local/bin/zakwas-check-notify]
#     schedule: {at: "10:00", weekdays: [mon, tue, wed, thu, fri]}
#     env: {PATH: "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin"}
#     log: ~/Library/Logs/zakwas-check.log

defaults:
  - {domain: com.apple.dock, key: autohide, value: true}
  - {domain: NSGlobalDomain, key: KeyRepeat, value: 2}
  - {domain: com.apple.finder, key: AppleShowAllExtensions, value: true}
